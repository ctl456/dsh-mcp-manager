# This optional Profile layer registers the MCP server manager: the
# mcp_manager_* tools and the Settings -> Plugins -> Plugin configuration ->
# "MCP servers" card. The registry starts empty; servers are added from the
# card or by the model, and the row owns one child dsh-mcp-client per enabled
# entry.

- insert:
    - id: mcp-manager
      name: '@ctl456/dsh-mcp-manager'
      config:
        servers: []
